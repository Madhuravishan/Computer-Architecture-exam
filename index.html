<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Architecture Master</title>
    <style>
        :root {
            --bg-body: #f4f7f6;
            --bg-sidebar: #1e293b;
            --bg-card: #ffffff;
            --text-main: #334155;
            --text-light: #64748b;
            --text-sidebar: #e2e8f0;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body { display: flex; height: 100vh; background-color: var(--bg-body); color: var(--text-main); overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: 280px; background-color: var(--bg-sidebar); color: var(--text-sidebar); display: flex; flex-direction: column; overflow-y: auto; transition: 0.3s; z-index: 100; flex-shrink: 0; }
        .logo-area { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-area h1 { font-size: 1.2rem; color: #fff; margin-bottom: 4px; }
        .logo-area p { font-size: 0.8rem; color: var(--accent-primary); font-weight: bold; }
        .nav-menu { padding: 15px 0; flex: 1; overflow-y: auto;}
        .nav-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.95rem; border-left: 4px solid transparent; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background-color: rgba(255,255,255,0.05); border-left-color: var(--accent-primary); color: #fff; }
        
        /* MAIN CONTENT */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 30px; position: relative; background: var(--bg-body);}
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header-title { font-size: 1.8rem; font-weight: bold; color: #0f172a; }

        /* CARDS & GRIDS */
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
        .stat-card { text-align: center; }
        .stat-value { font-size: 2rem; font-weight: bold; color: var(--accent-primary); margin: 10px 0; }
        
        /* BUTTONS */
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.95rem; display: inline-block; text-align: center;}
        .btn-primary { background: var(--accent-primary); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--accent-primary); color: var(--accent-primary); }
        .btn-outline:hover { background: var(--accent-primary); color: white; }
        .btn-block { width: 100%; margin-top: 10px; }

        /* QUIZ UI */
        .quiz-container { display: flex; gap: 20px; height: calc(100vh - 120px); }
        .quiz-main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding-right: 10px; }
        .quiz-nav { width: 280px; background: var(--bg-card); border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); display: flex; flex-direction: column; border: 1px solid var(--border); flex-shrink: 0; }
        
        .timer-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 15px 20px; border-radius: var(--radius); margin-bottom: 20px; box-shadow: var(--shadow); font-weight: bold; font-size: 1.1rem; border: 1px solid var(--border); }
        .timer-warning { color: var(--danger); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .question-card { background: var(--bg-card); padding: 30px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid var(--border); }
        .q-meta { font-size: 0.8rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;}
        .tag { padding: 4px 8px; border-radius: 4px; background: #e2e8f0; color: #334155; font-weight: bold; }
        .tag-hard { background: #fee2e2; color: #991b1b; }
        .tag-exam { background: #fef08a; color: #854d0e; }
        .tag-num { background: #dbeafe; color: #1e40af; }
        .question-text { font-size: 1.25rem; font-weight: 600; margin-bottom: 25px; line-height: 1.6; white-space: pre-line;}
        
        .option-btn { width: 100%; text-align: left; padding: 16px 20px; margin-bottom: 12px; border: 2px solid var(--border); background: white; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.2s; display: flex; gap: 15px; align-items: center; line-height: 1.4;}
        .option-btn:hover:not(:disabled) { border-color: var(--accent-primary); background: #f8fafc; }
        .option-btn.selected { border-color: var(--accent-primary); background: #eff6ff; }
        .option-btn.correct { border-color: var(--success); background: #ecfdf5; color: #065f46; }
        .option-btn.wrong { border-color: var(--danger); background: #fef2f2; color: #991b1b; }
        .option-btn:disabled { cursor: default; }

        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 15px; overflow-y: auto; padding-right: 5px;}
        .nav-dot { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #f1f5f9; cursor: pointer; font-size: 0.85rem; font-weight: bold; border: 1px solid var(--border); }
        .nav-dot.answered { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }
        .nav-dot.current { box-shadow: 0 0 0 3px rgba(37,99,235,0.3); }
        
        /* EXPLANATION AREA */
        .explanation-box { margin-top: 20px; padding: 20px; background: #f8fafc; border-left: 5px solid var(--accent-primary); border-radius: 0 8px 8px 0; display: none; }
        .exp-title { font-weight: bold; margin-bottom: 10px; color: #0f172a; font-size: 1.1rem;}
        .memory-trick { background: #fffbeb; padding: 12px; border-radius: 6px; border: 1px solid #fde68a; margin-top: 15px; font-style: italic; }
        .step-box { background: #1e293b; color: #f8fafc; padding: 15px; border-radius: 8px; font-family: monospace; margin: 15px 0; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.5;}

        /* LEARN MODULE */
        .learn-topic { margin-bottom: 40px; }
        .learn-topic h2 { color: var(--accent-primary); border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
        .concept-card { background: white; border-radius: var(--radius); padding: 25px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .concept-card h3 { color: #0f172a; margin-bottom: 15px; font-size: 1.3rem;}
        .c-block { margin-bottom: 15px; line-height: 1.6;}
        .c-block strong { color: var(--accent-primary); }

        .hidden { display: none !important; }
        
        /* FLASHCARDS */
        .flashcard-container { perspective: 1000px; width: 100%; height: 300px; margin-bottom: 20px; }
        .flashcard { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); background: white; }
        .card-back { transform: rotateY(180deg); background: #f8fafc; align-items: flex-start; text-align: left; overflow-y: auto;}
        
        /* WORKSPACE */
        .workspace { margin-top: 20px; width: 100%; }
        .workspace textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-family: monospace; resize: vertical; background: #f8fafc;}

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 200px; flex-direction: row; flex-wrap: wrap; padding: 10px; }
            .logo-area { display: none; }
            .nav-menu { display: flex; overflow-x: auto; white-space: nowrap; padding: 0; width: 100%;}
            .nav-item { border-left: none; border-bottom: 4px solid transparent; flex: 0 0 auto; padding: 10px;}
            .nav-item.active { border-bottom-color: var(--accent-primary); background: transparent; }
            .quiz-container { flex-direction: column; height: auto; }
            .quiz-nav { width: 100%; max-height: 200px; }
            .quiz-main { padding-right: 0;}
            .grid-3 { grid-template-columns: 1fr; }
        }
    </style>
</head>

        question: "Suppose you wish to run a program P with 7.5 × 10^9 instructions on a 5 GHz machine with a CPI of 0.8.\nWhat is the expected CPU Time?",

   ========================================================================== */
function nav(viewId) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    let navEl = document.getElementById('nav-' + viewId);
    if(navEl) navEl.classList.add('active');
    
    const main = document.getElementById('main-content');
    
    if (viewId === 'dashboard') renderDashboard(main);
    else if (viewId === 'learn') renderLearn(main);
    else if (viewId === 'flashcards') renderFlashcards(main);
}

function startQuizMode(mode) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    event.currentTarget.classList.add('active');

    let pool = [];
    if(mode === 'theory') pool = questionBank.filter(q => q.type === 'theory');
    else if(mode === 'numerical') pool = questionBank.filter(q => q.type === 'numerical');
    else if(mode === 'lab') pool = questionBank.filter(q => q.type === 'code' || q.type === 'scenario');
    else if(mode === 'cache') pool = questionBank.filter(q => q.topic === 'Cache Memory');
    else if(mode === 'pipeline') pool = questionBank.filter(q => q.topic === 'Pipelining');
    else if(mode === 'mock') pool = [...questionBank].sort(()=>Math.random()-0.5).slice(0, 30);
    else if(mode === 'mistakes') pool = questionBank.filter(q => state.mistakes[q.id]);
    else pool = [...questionBank].sort(()=>Math.random()-0.5).slice(0, 10);

    if(pool.length === 0) {
        alert("No questions available for this mode yet!");
        return;
    }

    currentQuiz = pool.sort(()=>Math.random()-0.5).map(q => ({...q, userAns: null}));
    currentQIndex = 0;
    timeLeft = mode === 'mock' ? currentQuiz.length * 60 : currentQuiz.length * 90; // 1-1.5 min per q
    state.currentMode = mode;
    
    renderQuizUI();
    startTimer();
}

function renderLearn(container) {
    container.innerHTML = `
        <div class="header-bar">
            <div class="header-title">📚 Learn Core Concepts</div>
        </div>
        
        <div class="learn-topic">
            <h2>1. Amdahl's Law (Performance)</h2>
            <div class="concept-card">
                <div class="c-block"><strong>WHAT IS IT?</strong> A formula used to find the maximum expected improvement to an overall system when only a <i>fraction</i> of the system is improved.</div>
                <div class="c-block"><strong>FORMULA:</strong> Overall Speedup = 1 / ((1 - f) + (f / s))<br>
                <em>f</em> = fraction of time the enhancement is used (e.g. 95% = 0.95)<br>
                <em>s</em> = the speedup of that specific enhancement (e.g. 10x)</div>
                <div class="c-block"><strong>WHY IT MATTERS:</strong> It proves the "Law of Diminishing Returns". Making a rare instruction 100x faster barely speeds up the CPU. Making a common instruction 1.5x faster is massive.</div>
                <div class="memory-trick">🧠 <strong>Memory Trick:</strong> Make the Common Case Fast. (1-f) is the part you DIDN'T touch. (f/s) is the part you sped up.</div>
            </div>
        </div>

        <div class="learn-topic">
            <h2>2. Pipeline Data Hazards</h2>
            <div class="concept-card">
                <div class="c-block"><strong>RAW (Read After Write):</strong> A true dependency. Instruction 2 needs to READ a register that Instruction 1 hasn't finished WRITING. Solution: <strong>Forwarding</strong>.</div>
                <div class="c-block"><strong>Load-Use Hazard:</strong> A specific RAW hazard where Instruction 1 is a LOAD (fetching from memory). Even with forwarding, you cannot bypass time. The data isn't retrieved until the MEM stage, but Instruction 2 needs it in EX. Solution: <strong>1-Cycle Stall + Forwarding</strong>.</div>
                <div style="margin-top:15px; color:var(--warning); font-weight:bold;">🎯 EXAM TIP: If a question asks about WAW (Write After Write) in a standard 5-stage MIPS pipeline, the answer is usually that they don't occur, because all writes happen strictly in-order in Stage 5 (WB).</div>
            </div>
        </div>
    `;
}

                <div class="timer-bar">
                    <span id="q-counter">Question 1 / ${currentQuiz.length}</span>

                    <button class="btn btn-primary" onclick="nextQ()">Next →</button>
                </div>
            </div>
            <div class="quiz-nav">
                <h3 style="margin-bottom:10px; font-size:1rem;">Question Navigator</h3>
                <div class="nav-grid" id="nav-grid"></div>
                <button class="btn btn-outline btn-block" style="margin-top:20px;" onclick="finishQuiz()">Submit Early</button>

    `;

function startTimer() {
    clearInterval(quizTimer);
    updateTimerUI();
    quizTimer = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if(timeLeft <= 0) {
            clearInterval(quizTimer);
            alert("Time's up! Submitting exam automatically.");
            finishQuiz();
        }
    }, 1000);
}

function updateTimerUI() {
    const el = document.getElementById('q-timer');
    if(!el) return;
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    el.innerText = `⏱ ${m}:${s}`;
    if(timeLeft < 60) el.classList.add('timer-warning');
}

function renderNav() {
    const grid = document.getElementById('nav-grid');
    if(!grid) return;
    grid.innerHTML = '';
    currentQuiz.forEach((q, i) => {
        const dot = document.createElement('div');
        dot.className = `nav-dot ${i === currentQIndex ? 'current' : ''} ${q.userAns !== null ? 'answered' : ''}`;
        dot.innerText = i + 1;
        dot.onclick = () => { currentQIndex = i; renderQ(); renderNav(); };
        grid.appendChild(dot);
    });
}

function renderQ() {
    const container = document.getElementById('q-card-container');
    document.getElementById('q-counter').innerText = `Question ${currentQIndex + 1} / ${currentQuiz.length}`;
    const q = currentQuiz[currentQIndex];
    
    document.getElementById('submit-quiz-btn').classList.toggle('hidden', currentQIndex !== currentQuiz.length - 1);

    let tagClass = q.difficulty === 'hard' ? 'tag-hard' : (q.type === 'numerical' ? 'tag-num' : '');
    let priorityTag = q.priority === 'EXAM' ? '<span class="tag tag-exam">🎯 EXAM POTENTIAL</span>' : '';
    
    let html = `
        <div class="question-card">
            <div class="q-meta">
                <span class="tag ${tagClass}">${q.topic.toUpperCase()}</span>
                <span class="tag">${q.difficulty.toUpperCase()}</span>
                ${priorityTag}
                <span style="margin-left:auto; cursor:pointer; font-weight:bold; color:var(--accent-primary);" onclick="toggleBookmark('${q.id}')">
                    ${state.bookmarks[q.id] ? '★ BOOKMARKED' : '☆ Bookmark'}
                </span>
            </div>
            <div class="question-text">${q.question.replace(/\n/g, '<br>')}</div>
    `;

    // Calculation workspace for numerical
    if(q.type === 'numerical' && q.userAns === null && state.currentMode !== 'mock') {
        html += `
            <div class="workspace">
                <p style="font-size:0.8rem; color:var(--text-light); margin-bottom:5px;">🧮 Optional Calculation Workspace (Not Graded)</p>
                <textarea placeholder="Jot down formulas and steps here before selecting an answer..."></textarea>
            </div><br>
        `;
    }

    html += `<div class="options-container">`;

    q.options.forEach((opt, idx) => {
        let btnClass = 'option-btn';
        if (q.userAns !== null) {
            // Mock exam hides correct answers until submission
            if(state.currentMode === 'mock') {
                if(idx === q.userAns) btnClass += ' selected';
                btnClass += ' disabled';
            } else {
                if (idx === q.correctAnswer) btnClass += ' correct';
                else if (idx === q.userAns) btnClass += ' wrong';
                else btnClass += ' disabled';
            }
        }

        html += `<button class="${btnClass}" onclick="selectAnswer(${idx})" ${q.userAns !== null ? 'disabled' : ''}>
                    <strong style="width:25px;display:inline-block">${String.fromCharCode(65+idx)}.</strong> ${opt}
                 </button>`;
    });

    html += `</div>`;

    // Explanations (hidden in Mock mode until submitted)
    if (q.userAns !== null && state.currentMode !== 'mock') {
        html += `<div class="explanation-box" style="display:block;">
                    <div class="exp-title">${q.userAns === q.correctAnswer ? '✅ Correct!' : '❌ Incorrect'}</div>
                    <p style="line-height:1.5;">${q.explanation}</p>`;
        
        if (q.solutionSteps) {
            html += `<div class="step-box"><strong>Mathematical Steps:</strong><br>${q.solutionSteps.join('<br>')}</div>`;
        }
        
        if (q.whyOthersWrong && q.userAns !== q.correctAnswer && q.whyOthersWrong[q.userAns]) {
            html += `<p style="color:var(--danger); margin-top:10px;"><strong>Why your answer is wrong:</strong> ${q.whyOthersWrong[q.userAns]}</p>`;
        }

        if (q.examTip) {
            html += `<p style="color:var(--warning); margin-top:10px; font-weight:bold;">🎯 EXAM TIP: ${q.examTip}</p>`;
        }

        if (q.memoryTrick) {
            html += `<div class="memory-trick">🧠 ${q.memoryTrick}</div>`;
        }

        html += `</div>`;
    }

    html += `</div>`;
    container.innerHTML = html;
}

window.toggleBookmark = function(id) {
    if(state.bookmarks[id]) delete state.bookmarks[id];
    else state.bookmarks[id] = true;
    saveState();
    renderQ(); 
}

window.selectAnswer = function(optIndex) {
    const q = currentQuiz[currentQIndex];
    if(q.userAns !== null) return; 
    
    q.userAns = optIndex;
    
    state.stats.totalAnswered++;
    if(optIndex === q.correctAnswer) {
        state.stats.correct++;
        if(state.mistakes[q.id]) {
            state.mistakes[q.id]--;
            if(state.mistakes[q.id] <= 0) delete state.mistakes[q.id];
        }
    } else {
        state.mistakes[q.id] = (state.mistakes[q.id] || 0) + 1;
    }
    
    saveState();
    renderQ();
    renderNav();
}

window.nextQ = function() {
    if(currentQIndex < currentQuiz.length - 1) {
        currentQIndex++;
        renderQ();
        renderNav();
    }
}
window.prevQ = function() {
    if(currentQIndex > 0) {
        currentQIndex--;
        renderQ();
        renderNav();
    }
}

window.finishQuiz = function() {
    clearInterval(quizTimer);
    let correct = currentQuiz.filter(q => q.userAns === q.correctAnswer).length;
    let unanswered = currentQuiz.filter(q => q.userAns === null).length;
    let acc = Math.round((correct / currentQuiz.length) * 100);
    
    const main = document.getElementById('main-content');
    main.innerHTML = `
        <div class="header-bar">
            <div class="header-title">🎓 Exam Results</div>
        </div>
        <div class="card" style="text-align:center; padding: 50px;">
            <h1 style="font-size:3rem; color:var(--accent-primary); margin-bottom:20px;">${acc}%</h1>
            <div style="font-size:1.2rem; color:var(--text-main); margin-bottom: 30px;">
                You scored ${correct} out of ${currentQuiz.length}.<br>
                <span style="color:var(--danger)">${unanswered > 0 ? `(You left ${unanswered} questions unanswered!)` : ''}</span>
            </div>
            
            <div class="grid-2">
                <button class="btn btn-outline" onclick="nav('dashboard')">Back to Dashboard</button>
                <button class="btn btn-primary" onclick="startQuizMode('mistakes')">Review Mistakes</button>
            </div>
        </div>
    `;
}

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */
window.onload = () => {
    nav('dashboard');
};
</script>
</body>
</html>
